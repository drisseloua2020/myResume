name: Deploy - Images

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  version-images:
    name: Version UI and API Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare GHCR image names
        id: images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "api=ghcr.io/${owner}/${repo}-api" >> "$GITHUB_OUTPUT"
          echo "ui=ghcr.io/${owner}/${repo}-ui" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.api }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: UI image metadata
        id: ui-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.ui }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: ${{ steps.ui-meta.outputs.tags }}
          labels: ${{ steps.ui-meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Published image tags
        run: |
          echo "API image tags:"
          echo "${{ steps.api-meta.outputs.tags }}"
          echo "UI image tags:"
          echo "${{ steps.ui-meta.outputs.tags }}"
