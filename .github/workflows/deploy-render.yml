name: Deploy - Render

on:
  workflow_call:
    secrets:
      RENDER_API_DEPLOY_HOOK:
        required: true
      RENDER_UI_DEPLOY_HOOK:
        required: true

permissions:
  contents: read

jobs:
  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy Backend to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: curl --fail-with-body --silent --show-error --retry 2 -X POST "$DEPLOY_HOOK"

      - name: Deploy UI to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_UI_DEPLOY_HOOK }}
        run: curl --fail-with-body --silent --show-error --retry 2 -X POST "$DEPLOY_HOOK"
