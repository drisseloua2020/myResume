name: Deploy - Render

on:
  workflow_call:
    secrets:
      RENDER_API_DEPLOY_HOOK:
        required: true
      RENDER_UI_DEPLOY_HOOK:
        required: true

permissions:
  contents: read

jobs:
  deployment:
    name: Deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false

    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}

      - name: Request production deploys for tested main commit
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          RENDER_UI_DEPLOY_HOOK: ${{ secrets.RENDER_UI_DEPLOY_HOOK }}
        run: python3 .github/scripts/deploy_render.py
