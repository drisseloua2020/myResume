name: Deploy - AppSec

on:
  workflow_call:

permissions:
  contents: read

jobs:
  appsec-check:
    name: AppSec Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install AppSec tools and project deps
        run: |
          cd services
          python -m pip install -r requirements.txt
          python -m pip install semgrep pip-audit
          cd ../ui
          npm ci

      - name: SAST - Semgrep
        run: |
          semgrep scan --config p/ci --error --exclude ui/node_modules --exclude ui/dist .

      - name: SCA - Python dependency audit
        run: |
          cd services
          python -m pip_audit -r requirements.txt

      - name: SCA - npm dependency audit
        run: |
          cd ui
          npm audit fix || true
          npm audit --audit-level=high

      - name: Start backend for DAST
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:///./appsec.db
          JWT_SECRET: appsec-secret
        run: |
          cd services
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 3000 > appsec-api.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          cat appsec-api.log
          exit 1

      - name: DAST - OWASP ZAP baseline
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed
        with:
          target: "http://127.0.0.1:3000"
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-I -m 5 -T 5"
