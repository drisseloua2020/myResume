name: Deploy - Backend E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-e2e-test:
    name: Backend E2E Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: services/requirements-dev.lock

      - name: Install backend deps
        run: |
          cd services
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Install PDF fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-wqy-zenhei

      - name: Run backend API E2E tests
        run: |
          cd services
          python -m pytest

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myresume_ci
          POSTGRES_USER: myresume_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myresume_ci -d myresume_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret
      DATABASE_URL: postgresql+psycopg://myresume_ci:ci-only-password@localhost:5432/myresume_ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r services/requirements.lock
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: services
      - run: python -m alembic -c alembic.ini check
        working-directory: services
