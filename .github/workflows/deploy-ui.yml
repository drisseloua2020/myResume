name: Deploy - UI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ui-test:
    name: UI Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        run: |
          cd ui
          npm ci

      - name: Run UI unit tests
        run: |
          cd ui
          npm test

      - name: Build UI
        run: |
          cd ui
          npm run build
