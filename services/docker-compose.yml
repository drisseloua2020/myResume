services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myresumes}
      POSTGRES_USER: ${POSTGRES_USER:-myresume_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the db service using psycopg}
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PORT: 3000
      UPLOAD_DIR: /data/protected_uploads
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - profile_photos:/data/protected_uploads
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
  ui:
    build: ../ui
    environment:
      PORT: 8080
      API_PUBLIC_URL: /api
      API_UPSTREAM: http://api:3000
    ports: ["127.0.0.1:4000:8080"]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
volumes:
  postgres_data:
  profile_photos:
